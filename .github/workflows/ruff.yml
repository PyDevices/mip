# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python
name: Python code lint and formatting with ruff
# Documentation-only changes can't change this result, so they don't run it.
on:
  push:
    branches: [PyDevices]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
jobs:
  ruff:
    # Synced PyDevices packages are linted in their canonical source repos.
    if: github.repository == 'micropython/micropython-lib'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - run: pip install --user ruff==0.1.2
    - run: ruff check --output-format=github .
    - run: ruff format --diff .
