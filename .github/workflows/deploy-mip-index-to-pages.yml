name: Deploy MIP index documentation to Pages

on:
  push:
    branches:
      - PyDevices
    paths:
      - .site/**
      - .github/workflows/deploy-mip-index-to-pages.yml
  workflow_dispatch:

concurrency:
  group: pydevices-mip-publication-queue
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  PACKAGE_INDEX_PATH: /tmp/pydevices-mip-site
  LOCKFILE: pydevices-lock.json
  # The tools' PROFILE_REPOSITORIES map is a second guard beside the
  # lockfile; publishing-v6..v8 still name PyDevices/audioif for the two
  # audio profiles that moved to PyDevices/audiocomponents (.github#35), so
  # at any of those tags the sync step below rejects the lockfile and the
  # deploy dies. Pin the commit that carries the corrected map -- the same
  # pin as publishing-tools-ref in process-mip-publication-request.yml --
  # until the next publishing tag is cut; then both lines become that tag.
  PUBLISHING_TOOLS_REF: 9aef8e68a2df90623d858c715bdc9e4145c67a55

jobs:
  build-complete-mip-pages-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Check out MIP source
        uses: actions/checkout@v4
        with:
          # Always build the branch TIP, never this run's trigger SHA: a
          # queued deploy from an older push otherwise rebuilds a stale
          # lockfile and, deploying last, overwrites a newer publication
          # (it re-stranded audioinstruments at 0.0.3 minutes after the
          # v0.0.4 republication on 2026-08-29).
          ref: PyDevices

      - name: Set up MIP build environment
        run: source tools/ci.sh && ci_build_packages_setup

      # The generated package trees are not committed -- they are rebuilt at
      # publish time from the sources named in pydevices-lock.json. This
      # workflow builds the index from the checked-out repository, so without
      # the same regeneration it compiles an index containing only the upstream
      # micropython-lib packages and deploys it over the real one, silently
      # removing every PyDevices package from https://PyDevices.github.io/mip.
      # That is exactly what a docs-only push to .site/ did on 2026-08-20.
      - name: Check out shared publishing tools
        uses: actions/checkout@v4
        with:
          repository: PyDevices/.github
          ref: ${{ env.PUBLISHING_TOOLS_REF }}
          path: .pydevices-publishing-tools

      # Fail here, naming the pin, rather than inside the sync loop after a
      # few clones: the tools' PROFILE_REPOSITORIES map must agree with every
      # lockfile entry. This is the check that would have caught
      # PUBLISHING_TOOLS_REF sitting at publishing-v6 after the two audio
      # profiles moved to PyDevices/audiocomponents.
      - name: Verify the publishing tools know every locked repository
        run: |
          python3 - <<'PY'
          import json, os, pathlib, sys

          sys.path.insert(0, ".pydevices-publishing-tools/scripts")
          from synchronize_mip_package import PROFILE_REPOSITORIES

          ref = os.environ["PUBLISHING_TOOLS_REF"]
          lock = json.loads(pathlib.Path(os.environ["LOCKFILE"]).read_text())
          wrong = [
              f"{profile}: tools at {ref} map it to {PROFILE_REPOSITORIES.get(profile)}, "
              f"lockfile says {entry['repository']}"
              for profile, entry in lock.items()
              if PROFILE_REPOSITORIES.get(profile) != entry["repository"]
          ]
          if wrong:
              print("\n".join(wrong), file=sys.stderr)
              print(f"move PUBLISHING_TOOLS_REF ({ref}) to a commit whose PROFILE_REPOSITORIES matches the lockfile", file=sys.stderr)
              raise SystemExit(1)
          print(f"tools at {ref} agree with the lockfile for all {len(lock)} profiles")
          PY

      - name: Synchronize every locked source into the working tree
        run: |
          set -euo pipefail
          rm -rf .publication-sources && mkdir -p .publication-sources

          python3 -c "
          import json
          for profile, entry in json.load(open('$LOCKFILE')).items():
              print(profile, entry['repository'], entry['ref'])
          " | while read -r profile repository ref; do
            echo "::group::$profile @ $ref"
            git clone --quiet --depth 1 --branch "$ref" \
              "https://github.com/${repository}.git" ".publication-sources/${profile}"
            version="${ref#v}"
            python .pydevices-publishing-tools/scripts/synchronize_mip_package.py \
              --source-repository ".publication-sources/${profile}" \
              --source-repository-name "$repository" \
              --mip-repository . \
              --profile "$profile" \
              --version "$version"
            echo "::endgroup::"
          done

      - name: Remove temporary checkouts
        run: rm -rf .publication-sources .pydevices-publishing-tools

      - name: Build latest-only package index
        run: |
          rm -rf "$PACKAGE_INDEX_PATH"
          source tools/ci.sh
          ci_build_packages_check_manifest
          ci_build_packages_compile_index
          cp -R .site/. "$PACKAGE_INDEX_PATH/"
          touch "$PACKAGE_INDEX_PATH/.nojekyll"

      # Never deploy an index that lost a locked package: a deploy replaces the
      # whole site, so a missing package here is a broken index, not a stale one.
      - name: Verify every locked package reached the index
        run: |
          python3 - <<'PY'
          import json, os, pathlib, sys

          index_root = pathlib.Path(os.environ["PACKAGE_INDEX_PATH"])
          lock = json.loads(pathlib.Path(os.environ["LOCKFILE"]).read_text())
          published = index_root / "package" / "py"

          expected = sorted({p.parent.name for p in pathlib.Path("micropython").rglob("manifest.py")})
          missing = [n for n in expected if not (published / n / "latest.json").is_file()]
          print(f"{len(expected)} manifests, {len(list(published.iterdir()))} packages in the index")
          if missing:
              print("MISSING FROM INDEX:", missing, file=sys.stderr)
              raise SystemExit(1)

          for profile, entry in lock.items():
              want = entry["ref"].lstrip("v")
              got = json.loads((published / profile / "latest.json").read_text())["version"]
              if got != want:
                  print(f"{profile}: index has {got}, lockfile says {want}", file=sys.stderr)
                  raise SystemExit(1)
              print(f"  {profile} {got}")
          print("index matches the lockfile")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload complete Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PACKAGE_INDEX_PATH }}

  deploy-complete-mip-index:
    needs: build-complete-mip-pages-artifact
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy MIP index documentation
        id: deployment
        uses: actions/deploy-pages@v4

  # The committed package list (packages.json + the README block) describes
  # the index that just went live; see refresh-package-list.yml. contents:
  # write is granted to this job only, for that commit.
  refresh-package-list:
    needs: deploy-complete-mip-index
    permissions:
      contents: write
    uses: ./.github/workflows/refresh-package-list.yml
