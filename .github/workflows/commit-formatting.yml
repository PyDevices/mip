name: Check commit message formatting

on:
  push:
    branches: [PyDevices]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The PyDevices fork is a long-lived generated package branch with its own
    # historical commit convention; canonical source repos validate commits.
    if: github.repository == 'micropython/micropython-lib'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: '100'
    - uses: actions/setup-python@v7
    - name: Check commit message formatting
      run: source tools/ci.sh && ci_commit_formatting_run
