name: Process serialized MIP publication request

on:
  repository_dispatch:
    types:
      - publish-package-release
  workflow_dispatch:
    inputs:
      source-repository:
        description: GitHub OWNER/REPOSITORY to publish
        required: true
        type: string
      source-ref:
        description: Exact release tag or commit
        required: true
        type: string
      version:
        description: Normalized X.Y.Z release version
        required: true
        type: string
      profile:
        description: Shared synchronization profile
        required: true
        type: choice
        options:
          - palettes
          - pdwidgets
          - pygraphics
          - pydevices
          - audioinstruments
          - audioeffects

concurrency:
  group: pydevices-mip-publication-queue
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  synchronize-build-and-stage:
    uses: PyDevices/.github/.github/workflows/reusable-synchronize-mip-package.yml@publishing-v12
    with:
      source-repository: ${{ github.event.client_payload.source_repository || inputs.source-repository }}
      source-ref: ${{ github.event.client_payload.source_ref || inputs.source-ref }}
      version: ${{ github.event.client_payload.version || inputs.version }}
      profile: ${{ github.event.client_payload.profile || inputs.profile }}
      # publishing-v9 (.github#37): the lockfile is the single owner of
      # profile -> repository. The reusable's record step refuses a dispatch
      # from a repository the lockfile does not name for that profile, and the
      # tools take the expected repository from the lockfile rather than a
      # second hardcoded map. Move a profile by editing pydevices-lock.json on
      # this branch, never by changing a pin.
      publishing-tools-ref: publishing-v12
    # The sync mints its own App token; inherit passes the App secrets through.
    secrets: inherit

  deploy-complete-mip-index:
    needs: synchronize-build-and-stage
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the complete MIP index to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # The committed package list (packages.json + the README block) describes
  # the index that just went live; see refresh-package-list.yml. It sits on
  # top of the lockfile commit the reusable workflow pushed.
  refresh-package-list:
    needs: deploy-complete-mip-index
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/refresh-package-list.yml
