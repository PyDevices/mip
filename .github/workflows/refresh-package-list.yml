name: Refresh the package list from the deployed index

# Called after the deploy job of both workflows that publish the index:
# process-mip-publication-request.yml (every publication -- the path that
# runs many times a week) and deploy-mip-index-to-pages.yml (docs pushes and
# manual runs). Without this the committed list only moved on the rare path,
# and went stale after every real publication.
#
# The index is read out of the run's own github-pages artifact, not fetched
# from https://PyDevices.github.io/mip: Pages serves index.json behind a CDN
# with a ten-minute cache, so a fetch straight after the deploy can still
# return the previous index. The artifact is byte-for-byte what went live.
#
# scripts/update_package_list.py refuses to write anything that disagrees
# with pydevices-lock.json, so a stale or hand-edited state fails this job
# (visibly, after the deploy already succeeded) instead of being committed.
#
# The same commit regenerates .site/index.html, whose "Packages in this
# index" table is rendered from packages.json by PyDevices/.github's
# scripts/generate_sites.py (--only mip). Without that the page lagged one
# publication behind and .github's generator-idempotency check failed after
# every release (.github#51, #54). The generator comes from .github's main,
# not a publishing tag: that check runs main's generator against this
# branch, so main's output is the one the page has to match.
#
# The site that just went live was built before the page moved, so when the
# page changed, redeploy-site-page puts the deployed artifact back up with
# only index.html replaced. It is not rebuilt from source: index.json and the
# packages stay byte-for-byte what the first deploy published.
#
# The commit goes back with GITHUB_TOKEN, which triggers no workflows, so the
# .site/** path filter on deploy-mip-index-to-pages.yml doesn't fire on it.
# No loop.

on:
  workflow_call:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  REFRESHED_PAGES_ARTIFACT: github-pages-refreshed

jobs:
  refresh-package-list:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      page-changed: ${{ steps.commit.outputs.page-changed }}
    steps:
      - name: Check out the branch tip
        uses: actions/checkout@v4
        with:
          # The tip, not the trigger SHA: a publication run has just pushed
          # its lockfile commit, and the list must sit on top of it.
          ref: PyDevices
          # Full history so the commit below can rebase if a push races.
          fetch-depth: 0

      - name: Download the deployed site
        uses: actions/download-artifact@v8
        with:
          name: github-pages
          path: ${{ runner.temp }}/deployed

      - name: Unpack index.json from the Pages artifact
        run: |
          set -euo pipefail
          tarball=$(find "$RUNNER_TEMP/deployed" -name artifact.tar -print -quit)
          [ -n "$tarball" ] || { echo "no artifact.tar in the github-pages artifact" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/site"
          tar -xf "$tarball" -C "$RUNNER_TEMP/site"
          test -f "$RUNNER_TEMP/site/index.json"
          python3 -c "import json, sys; d = json.load(open(sys.argv[1])); print(len(d['packages']), 'packages, index updated', d['updated'])" "$RUNNER_TEMP/site/index.json"

      - name: Refresh the package list from the deployed index
        run: python3 scripts/update_package_list.py --index "$RUNNER_TEMP/site/index.json"

      - name: Check out the site generator
        uses: actions/checkout@v4
        with:
          repository: PyDevices/.github
          ref: main
          path: .pydevices-site-generator/dotgithub

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The generator finds mip as its 'mip' sibling, so lay out a two-repo
      # workspace: .github as dotgithub, and a link to this checkout as mip.
      - name: Regenerate the site page from the package list
        run: |
          set -euo pipefail
          ln -s .. .pydevices-site-generator/mip
          python3 .pydevices-site-generator/dotgithub/scripts/generate_sites.py --only mip
          rm -rf .pydevices-site-generator

      - name: Commit the package list and site page
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add packages.json README.md .site/index.html
          if git diff --cached --quiet -- .site/index.html; then
            echo "page-changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "page-changed=true" >> "$GITHUB_OUTPUT"
          fi
          if git diff --cached --quiet; then
            echo "Package list and page already match the deployed index."
          else
            git commit -m "Refresh the package list from the deployed index"
            # Same rebase-and-retry as the lockfile commit in dotgithub's
            # reusable-synchronize-mip-package.yml: the queue serializes
            # runs, but a commit can still land between checkout and push.
            for attempt in 1 2 3; do
              if git push origin HEAD; then break; fi
              echo "push rejected (attempt $attempt); rebasing onto origin"
              git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)"
              [ "$attempt" = 3 ] && { echo "push failed after 3 rebase attempts" >&2; exit 1; }
            done
          fi

      - name: Put the new page into the deployed site
        if: steps.commit.outputs.page-changed == 'true'
        run: cp .site/index.html "$RUNNER_TEMP/site/index.html"

      - name: Upload the site with the new page
        if: steps.commit.outputs.page-changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ env.REFRESHED_PAGES_ARTIFACT }}
          path: ${{ runner.temp }}/site

  redeploy-site-page:
    needs: refresh-package-list
    if: needs.refresh-package-list.outputs.page-changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the site with the refreshed page
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.REFRESHED_PAGES_ARTIFACT }}
